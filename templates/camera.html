<!DOCTYPE html>
<html>
<head>
    <title>Camera Capture</title>
    <style>
        .camera-container {
            text-align: center;
            padding: 20px;
        }
        #video, #canvas {
            margin-bottom: 10px;
            border: 2px solid #333;
        }
        .button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="camera-container">
        <video id="video" width="640" height="480" autoplay></video>
        <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
        <div>
            <button id="capture" class="button">Capture Photo</button>
            <button id="save" class="button" style="display:none;">Save Photo</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if we're on HTTP
            if (window.location.protocol === 'http:') {
                // Show warning and permission prompt
                const warning = document.createElement('div');
                warning.innerHTML = `
                    <div style="background: #ffebee; padding: 15px; margin: 10px; border-radius: 5px; text-align: center;">
                        <p><strong>Camera Access Required</strong></p>
                        <p>This site needs camera access to function. Please:</p>
                        <ol style="text-align: left;">
                            <li>Click the camera blocked icon (🚫) in your browser's address bar</li>
                            <li>Select "Always allow" for camera access</li>
                            <li>Refresh the page</li>
                        </ol>
                        <button onclick="requestCamera()" style="padding: 10px; margin: 10px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
                            Request Camera Access
                        </button>
                    </div>
                `;
                document.body.insertBefore(warning, document.body.firstChild);
            }
        });

        async function requestCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                // If we get here, permission was granted
                stream.getTracks().forEach(track => track.stop()); // Stop the stream
                location.reload(); // Reload the page to start using the camera
            } catch (err) {
                alert('Camera access denied. Please allow camera access through your browser settings.');
                console.error('Error accessing camera:', err);
            }
        }

        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let captureButton = document.getElementById('capture');
        let saveButton = document.getElementById('save');
        let stream;

        // Get camera access
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(s) {
                stream = s;
                video.srcObject = stream;
            })
            .catch(function(err) {
                alert('Error accessing camera: ' + err);
            });

        // Capture photo
        captureButton.addEventListener('click', function() {
            if (captureButton.textContent === 'Capture Photo') {
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.style.display = 'block';
                video.style.display = 'none';
                saveButton.style.display = 'inline-block';
                captureButton.textContent = 'Retake';
            } else {
                canvas.style.display = 'none';
                video.style.display = 'block';
                saveButton.style.display = 'none';
                captureButton.textContent = 'Capture Photo';
            }
        });

        // Save photo
        saveButton.addEventListener('click', function() {
            canvas.toBlob(function(blob) {
                const name1 = '{{ name1 }}';
                const id = '{{ ID }}';
                const designation = '{{ Designation }}';
                const fileName = `${name1}.${id}.${designation}.png`;

                const formData = new FormData();
                formData.append('image', blob, fileName);  // Use the formatted filename
                formData.append('name1', name1);
                formData.append('name2', id);
                formData.append('name3', designation);

                fetch('/save-photo', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Stop the camera stream
                        if (stream) {
                            stream.getTracks().forEach(track => track.stop());
                        }
                        
                        // Show success message with captured details
                        const successDiv = document.createElement('div');
                        successDiv.innerHTML = `
                            <div style="background: #e8f5e9; padding: 20px; margin: 20px; border-radius: 5px; text-align: center;">
                                <h3>Registration Successful!</h3>
                                <p><strong>Name:</strong> ${name1}</p>
                                <p><strong>ID:</strong> ${id}</p>
                                <p><strong>Designation:</strong> ${designation}</p>
                                <img src="${canvas.toDataURL()}" style="max-width: 300px; margin: 10px;">
                                <br>
                                <button onclick="window.location.href='/'" class="button">Back to Home</button>
                            </div>
                        `;
                        
                        // Replace camera container with success message
                        const cameraContainer = document.querySelector('.camera-container');
                        cameraContainer.innerHTML = '';
                        cameraContainer.appendChild(successDiv);
                    } else {
                        alert('Error saving photo: ' + data.error);
                    }
                })
                .catch(error => {
                    alert('Error: ' + error);
                });
            }, 'image/png');
        });

        // Clean up when leaving page
        window.onbeforeunload = function() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        };
    </script>
</body>
</html>
